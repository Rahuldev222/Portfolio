    <!-- 2. Three.js aur Vanta Fog ke CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>

<!-- 3. Fog Initialization -->
<script>
    VANTA.FOG({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        highlightColor: 0x9aff20,  // Yellowish
        midtoneColor: 0xb3b3b3,    // White
        lowlightColor: 0xffffff,   // Greenish
        baseColor: 0xe0e0e0,       // Light greenish base
        blurFactor: 0.9,
        speed: 1.50,
        zoom: 1.20,
    })
</script>
