
    <!-- Naya Contact/Hire Me Section jo scroll karne par aayega -->
    <div class="contact-section" id="contact-area">
        <h2>Let's <span>work together.</span></h2>
        <p class="role">Fill out the form below and I'll get back to you shortly.</p>

        <!-- Django Form Ready -->
        <form class="contact-form" action="" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>
                    <input type="text" name="name" placeholder="Your Name" required>
                </label>
            </div>
            <div class="form-group">
                <label>
                    <input type="email" name="email" placeholder="Your Email Address" required>
                </label>
            </div>
            <div class="form-group">
                <label>
                    <textarea name="message" placeholder="Project details or message..." required></textarea>
                </label>
            </div>
            <!-- Yahan class="a1" use kiya hai taaki button ka design same rahe -->
            <button type="submit" class="a1"
                style="width: fit-content; border: 1px solid black; padding: 12px 32px; font-size: 18px; font-family: 'Poppins', sans-serif; cursor: pointer; border-radius: 50px;">Send
                Message</button>
        </form>
    </div>
